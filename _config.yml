title: Ady and Mich Travelling the World
description: Our travels, Our experiences, day by day
url: "https://travel.amvhome.net"
baseurl: ""
timezone: Australia/Sydney

# Front page banner. Leave hero_title / hero_subtitle blank to use title / description above.
# hero_image: a wide landscape photo in /images, about 2000px wide, e.g. /images/hero.jpg (blank = no photo).
hero_title: "Ankor Wat"
hero_subtitle: "Sunrise"
hero_image: "/images/hero.jpg"

# Links on the right of the header.
nav:
  - title: Trips
    url: /#trips
  - title: Blog
    url: /blog/
  - title: Tech ↗
    url: https://tech.amvhome.net

# Each trip's days live in <trip>/_posts/, blog posts in blog/_posts/.
# The folder becomes the post's category, which is the first part of its address:
#   mediterranean-2027/_posts/2027-04-29-day-03-colosseum.md -> /mediterranean-2027/day-03-colosseum/
#   blog/_posts/2026-10-26-packing-list.md                    -> /blog/packing-list/
permalink: /:categories/:title/

# Posts dated in the future are NOT published (handy for posting days late).
future: false

# One file per trip in _trips/. The file name is the trip's address and folder name.
collections:
  trips:
    output: true
    permalink: /:name/

defaults:
  - scope:
      type: trips
    values:
      layout: trip
  - scope:
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - tools
